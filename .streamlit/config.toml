# Native Streamlit theming — a cosmic (deep-space purple/black) palette.
# Both light and dark tables use the same values so the app is always the space
# theme regardless of the viewer's system preference. All pairs pass WCAG AA.

[theme]
font = "Inter"
headingFont = "Fraunces"
baseRadius = "0.3rem"
showWidgetBorder = true

[theme.light]
backgroundColor = "#0B0714"          # deep space
secondaryBackgroundColor = "#17122C" # panels / sidebar / inputs
textColor = "#EAE6F8"                # starlight
primaryColor = "#7C4DFF"             # nebula violet (white text = 4.8:1)
borderColor = "#2C2550"
linkColor = "#A78BFA"

[theme.dark]
backgroundColor = "#0B0714"
secondaryBackgroundColor = "#17122C"
textColor = "#EAE6F8"
primaryColor = "#7C4DFF"
borderColor = "#2C2550"
linkColor = "#A78BFA"

[client]
toolbarMode = "minimal"

[server]
headless = true
