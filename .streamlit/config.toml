# Native Streamlit theming — the missionadrastea.org brand palette (deep-space
# purple/black). Both light and dark tables use the same values so the app is
# always the brand theme regardless of the viewer's system preference. AA-validated.

[theme]
font = "Inter"
headingFont = "Fraunces"
baseRadius = "0.3rem"
showWidgetBorder = true

[theme.light]
backgroundColor = "#07040F"          # --bg
secondaryBackgroundColor = "#130B26" # panels / sidebar / inputs
textColor = "#F6F0FF"                # --ink
primaryColor = "#7415C9"             # --brand (white text = 7.8:1)
borderColor = "#2A1A45"
linkColor = "#C9A7FF"                # --lilac

[theme.dark]
backgroundColor = "#07040F"
secondaryBackgroundColor = "#130B26"
textColor = "#F6F0FF"
primaryColor = "#7415C9"
borderColor = "#2A1A45"
linkColor = "#C9A7FF"

[client]
toolbarMode = "minimal"

[server]
headless = true
